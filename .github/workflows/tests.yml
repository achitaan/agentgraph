name: tests

on:
  push:
    branches: [main, "win-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}${{ matrix.no-sh && ', no sh' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        no-sh: [false]
        include:
          # The same suite on Windows with Git's `sh` taken off PATH, so the `cmd` fallback for check commands
          # and the install.cmd path are what is tested, as on a Windows machine without Git for Windows.
          - os: windows-latest
            python-version: "3.12"
            no-sh: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The Python suite goes through tests/ci_run.py: every test module in a process of its own with a time limit
      # (300 s), one flushed line per module in this log as it ends, a stack dump and the name of the running test
      # when a module hangs (its whole process tree is then stopped and the run goes on), and every module's full
      # output in ci-logs/ (uploaded at the end, whatever happened). --budget stops starting new modules after 48
      # minutes, so the summary, the node steps and the upload still happen inside the 60-minute job limit.
      # Node 24: tui-plugin/test/run.mjs needs module.registerHooks (Node 22.15 or later); Node 24 is what the
      # tests are developed with, and the other three node suites need nothing newer than Node 20.

      # Windows runs from PowerShell (pwsh) with the console's own code page: no bash, no PYTHONUTF8, so a place
      # that only works under UTF-8 or only with a Unix shell fails here as it would for a user.
      - name: Python tests (Windows, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ('${{ matrix.no-sh }}' -eq 'true') {
            $kept = $env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'sh.exe')) }
            $env:PATH = $kept -join ';'
            if (Get-Command sh -ErrorAction SilentlyContinue) { throw 'sh is still on PATH' }
            Write-Output 'sh removed from PATH'
          }
          python tests/ci_run.py --jobs 2 --limit 300 --budget 2900 --logs ci-logs
          exit $LASTEXITCODE

      - name: Python tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python tests/ci_run.py --jobs 2 --limit 300 --budget 2900 --logs ci-logs

      - name: Terminal plugin tests
        if: ${{ always() && !matrix.no-sh }}
        run: node tui-plugin/test/run.mjs

      - name: Desktop plugin tests
        if: ${{ always() && !matrix.no-sh }}
        run: node desktop-plugin/test/harness.mjs

      - name: Rollover plugin tests
        if: ${{ always() && !matrix.no-sh }}
        run: node rollover-plugin/test.js

      - name: Output caps plugin tests
        if: ${{ always() && !matrix.no-sh }}
        run: node output-caps-plugin/test.js

      # always() also runs when the job was cancelled (by a person or by the job's time limit), which
      # `success()`, `failure()` and `!cancelled()` do not: the earlier run showed the steps marked always() still
      # ran after the 40-minute cancel. The logs are uploaded on a pass as well, so the timings can be read.
      - name: Keep the test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}-py${{ matrix.python-version }}${{ matrix.no-sh && '-no-sh' || '' }}
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

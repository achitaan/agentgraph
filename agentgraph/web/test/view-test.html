<script>
  const indexBootstrap = /* INDEX_BOOTSTRAP */;
  (async () => {
    const results = [];
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const deferred = () => { let resolve, reject; const promise = new Promise((yes, no) => { resolve = yes; reject = no; }); return { promise, resolve, reject }; };
    const step = (id, agent, extra = {}) => ({ id, agent, type: 'implement', goal: id, status: 'running', session: null, busy: false, attempts: 1, tiers: [], scope: [], changed_paths: [], depends_on: [], artifacts: [], inputs: [], ...extra });
    const agent = (name, group, extra = {}) => ({ name, group, team: 'main', parent: '', model: 'Test model', effort: 'high', busy: 0, sessions: [], ...extra });
    function fixture() {
      return {
        version: 1, source: 'demo', team: 'main', warnings: [],
        totals: { sessions: 1, running: 1, cost: 0, tokens_in: 0, tokens_out: 0 },
        root: { agent: 'orchestrator' },
        agents: [agent('orchestrator', 'hub'), agent('impl-openai', 'build', { busy: 1, sessions: [{ id: 's1', title: 'Work', busy: true, model: 'Test model', cost: 0 }] }), agent('impl-claude', 'build'), agent('impl-hard', 'build'), agent('reviewer', 'verify'), agent('council', 'council'), agent('councillor-claude', 'council', { parent: 'council' }), agent('team-b-lead', 'hub', { team: 'team-b' }), agent('team-b-worker', 'build', { team: 'team-b' })],
        escalation: [{ from: 'impl-openai', to: 'impl-claude', used: false }, { from: 'impl-claude', to: 'impl-hard', used: true }],
        graph: { task: 'view-tests', goal: 'Test the view', status: 'running', progress: { passed: 0, total: 2 }, coverage: { delivered: 0, total: 0 }, objectives: [], problems: [], advice: [], events: [], amendments: [], lessons: [],
          nodes: [step('stale-step', 'impl-openai', { goal: 'Old unfinished work' }), step('current-step', 'impl-openai', { session: 's1', busy: true, goal: 'Current work', artifacts: [{ id: 'result', revision: 3, path: 'result.md' }], inputs: [{ from: 'upstream', artifact: 'plan', revision: 2, stale: true }] })],
          flows: [{ from: 'reviewer', to: 'impl-openai', kind: 'data', pairs: [['review', 'current-step']], artifacts: ['plan'], active: false }, { from: 'reviewer', to: 'impl-openai', kind: 'feedback', pairs: [['review', 'current-step']], artifacts: ['review-notes'], active: true }] }
      };
    }
    function host() {
      const root = document.createElement('div'); root.style.cssText = 'position:relative;width:1100px;height:760px';
      document.getElementById('fixtures').append(root); return root;
    }
    async function using(data, run, options = {}) {
      const root = host(), app = AgentGraph.mount(root, { fetchSnapshot: async () => data, intervalMs: 60000, motion: 'none', ...options });
      try { await app.refresh(); await run(root, app); } finally { app.destroy(); root.remove(); }
    }
    function open(root, name) { root.querySelector('[data-agent="' + name + '"]').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); }
    function move(root, name) { root.querySelector('[data-agent="' + name + '"]').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', shiftKey: true, bubbles: true })); }
    const edge = (root, kind, name) => [...root.querySelectorAll('line[data-edge]')].find(e => e.dataset.kind === kind && e.dataset.edge === name);
    async function resizeTo(root, width, height) {
      root.style.width = width + 'px'; root.style.height = height + 'px';
      root.getBoundingClientRect();
      await sleep(150);
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }
    function circleBounds(root) {
      return [...root.querySelectorAll('[data-agent]')].map(node => ({ name: node.dataset.agent, bounds: node.querySelector('.ag-halo').getBoundingClientRect() }));
    }
    function assertFits(root) {
      const viewport = root.querySelector('.ag-viewport').getBoundingClientRect(), circles = circleBounds(root);
      const compact = root.classList.contains('ag-canvas-compact') || root.classList.contains('ag-compact');
      const anchor = root.querySelector('[data-agent="orchestrator"] .ag-core') || root.querySelector('[data-agent] .ag-core');
      const anchorY = anchor?.getBoundingClientRect().y;
      assert(viewport.width > 0 && viewport.height > 0, 'canvas has no room');
      circles.forEach(({ name, bounds: b }) => {
        assert(b.left >= viewport.left - .1 && b.right <= viewport.right + .1, name + ' is horizontally clipped');
        if (!compact) assert(b.top >= viewport.top - .1 && b.bottom <= viewport.bottom + .1, name + ' is vertically clipped');
      });
      circles.forEach(({ name, bounds: a }, i) => circles.slice(i + 1).forEach(({ name: other, bounds: b }) => {
        const distance = Math.hypot(a.x + a.width / 2 - b.x - b.width / 2, a.y + a.height / 2 - b.y - b.height / 2);
        assert(distance >= (a.width + b.width) / 2 - .1, name + ' overlaps ' + other);
      }));
      const frame = root.getBoundingClientRect();
      assert(root.scrollWidth <= frame.width + 1, 'content overflows the panel');
      root.querySelectorAll('.ag-header > *, .ag-summary > *, .ag-controls').forEach(item => {
        if (!item.getClientRects().length) return;
        const b = item.getBoundingClientRect();
        assert(b.left >= frame.left - .1 && b.right <= frame.right + .1, 'header or controls clipped: ' + item.className);
      });
      if (compact) {
        const scale = root.querySelector('.ag-drawing > g').getCTM().a;
        assert(scale >= .85, 'automatic layout shrank below readable scale: ' + scale);
        root.querySelectorAll('.ag-agent-name').forEach(label => assert(parseFloat(getComputedStyle(label).fontSize) * scale >= 11, 'agent label is too small'));
        if (circles.length >= 7) assert(Math.max(...circles.map(c => c.bounds.right)) - Math.min(...circles.map(c => c.bounds.left)) >= viewport.width * .7, 'nodes form a thin strip rather than using the panel width');
        const overflow = circles.some(({ bounds: b }) => b.top < viewport.top || b.bottom > viewport.bottom);
        if (overflow) assert(!root.querySelector('.ag-pan-cue').hidden, 'vertical overflow has no cue');
        // Every clipped agent must be reachable, without zooming out.
        circles.forEach(({ name }) => {
          const node = root.querySelector('[data-agent="' + name + '"] .ag-halo'), b = node.getBoundingClientRect();
          root.querySelector('.ag-viewport').dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: b.y + b.height / 2 - viewport.y - viewport.height / 2 }));
          const reached = node.getBoundingClientRect();
          assert(reached.top >= viewport.top - .1 && reached.bottom <= viewport.bottom + .1, name + ' cannot be reached by panning');
        });
        if (anchor) root.querySelector('.ag-viewport').dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: anchor.getBoundingClientRect().y - anchorY }));
      }
    }
    function crowdedFixture() {
      const data = fixture();
      data.agents.push(agent('lookup-a', 'understand'), agent('lookup-b', 'understand'), agent('advisor-a', 'decide'), agent('advisor-b', 'decide'), agent('impl-extra-a', 'build'), agent('impl-extra-b', 'build'), agent('secondary-hub', 'hub'), agent('councillor-b', 'council', { parent: 'council' }), agent('councillor-c', 'council', { parent: 'council' }));
      return data;
    }
    function loopFixture(data = fixture()) {
      data.graph.loops = [
        { id: 'working-loop', worker: 'impl-openai', evaluator: 'reviewer', pairs: [['current-step', 'review-step']], rounds: 3, state: 'working', active: true, artifacts: ['review-findings'] },
        { id: 'checking-loop', worker: 'impl-claude', evaluator: 'reviewer', pairs: [['build-step', 'check-step']], rounds: 1, state: 'checking', active: true, artifacts: [] },
        { id: 'closed-loop', worker: 'impl-hard', evaluator: 'reviewer', pairs: [['hard-step', 'final-check']], rounds: 1, state: 'closed', active: false, artifacts: [] },
        { id: 'unlisted-loop', worker: 'impl-openai', evaluator: 'unlisted-evaluator', pairs: [], rounds: 2, state: 'checking', active: true, artifacts: [] }

      data.graph.flows.push({ from: 'impl-openai', to: 'reviewer', kind: 'data', pairs: [], active: true, artifacts: [] });
      return data;
    }
    function workLoopFixture(data = loopFixture()) {
      if (!data.graph.loops) loopFixture(data);
      if (!data.agents.some(a => a.name === 'designer')) data.agents.push(agent('designer', 'build'));
      if (!data.agents.some(a => a.name === 'explorer')) data.agents.push(agent('explorer', 'understand'));
      data.graph.work_loops = [
        { agent: 'impl-openai', nodes: ['current-step'], rounds: 3, state: 'working', active: true },
        { agent: 'impl-claude', nodes: ['check-step'], rounds: 2, state: 'waiting', active: false },
        { agent: 'impl-hard', nodes: ['hard-step'], rounds: 4, state: 'stuck', active: false },
        { agent: 'designer', nodes: ['design-step'], rounds: 1, state: 'closed', active: false },
        { agent: 'explorer', nodes: [], rounds: 0, state: 'idle', active: false },
        { agent: 'unlisted-worker', nodes: [], rounds: 1, state: 'working', active: true }

      return data;
    }
    function loopHalves(root, id) { return [...root.querySelectorAll('path[data-loop]')].filter(path => path.dataset.loop === id); }
    function assertLoopShapes(root) {
      assert(!root.querySelector('rect'), 'network contains a box');
      root.querySelectorAll('path, ellipse').forEach(shape => assert(shape.hasAttribute('data-loop') || shape.hasAttribute('data-work-loop'), 'curved edge is not a loop'));
      root.querySelectorAll('[data-edge]').forEach(edge => assert(edge.tagName.toLowerCase() === 'line', 'ordinary edge is not straight'));
    }
    function assertLoopCorridors(root, data = loopFixture()) {
      const visibleLoops = data.graph.loops.filter(loop => root.querySelector('[data-agent="' + loop.worker + '"]') && root.querySelector('[data-agent="' + loop.evaluator + '"]'));
      assert(root.querySelectorAll('path[data-loop]').length === visibleLoops.length * 2, 'expected two arcs per visible review loop');
      root.querySelectorAll('path[data-loop]').forEach(path => {
        const loop = visibleLoops.find(item => item.id === path.dataset.loop), matrix = path.getCTM();
        const length = path.getTotalLength(), points = Array.from({ length: 81 }, (_, i) => path.getPointAtLength(length * i / 80).matrixTransform(matrix));
        root.querySelectorAll('[data-agent]').forEach(node => {
          if ([loop.worker, loop.evaluator].includes(node.dataset.agent)) return;
          const circle = node.querySelector('.ag-core'), transform = circle.getCTM(), p = { x: transform.e, y: transform.f };
          const radius = Number(circle.getAttribute('r')) * Math.hypot(transform.a, transform.b);
          let clearance = Infinity;
          points.slice(1).forEach((b, i) => {
            const a = points[i], dx = b.x - a.x, dy = b.y - a.y, t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
            clearance = Math.min(clearance, Math.hypot(p.x - a.x - t * dx, p.y - a.y - t * dy));
          });
          assert(clearance >= radius + 1, root.clientWidth + 'px ' + path.dataset.loop + ' crosses ' + node.dataset.agent + ' (' + clearance.toFixed(1) + ' < ' + (radius + 1).toFixed(1) + ')');
        });
      });
    }
    async function test(name, run) {
      try { await run(); results.push('PASS ' + name); } catch (error) { results.push('FAIL ' + name + ': ' + error.message); }
    }

    await test('document error is visible, one line, and safe', async () => {
      await using({ version: 1, error: 'python3 was not found\n<img src=x onerror=alert(1)>' }, root => {
        const notice = root.querySelector('.ag-notice');
        assert(root.dataset.state === 'error' && !notice.hidden, 'error state missing');
        assert(notice.textContent.includes('python3 was not found'), 'real error hidden');
        assert(!notice.textContent.includes('\n') && !root.querySelector('img'), 'unsafe or multiline error');
        assert(!notice.textContent.includes('Connection interrupted'), 'document error was mislabeled as a connection failure');
      });
    });
    await test('index forwards JSON errors from non-OK responses', async () => {
      let options;
      const fakeWindow = { AgentGraph: { mount: (_, value) => { options = value; } } };
      new Function('window', 'document', 'location', 'fetch', indexBootstrap)(fakeWindow, { getElementById: () => ({ dataset: {} }) }, { search: '' }, async () => ({ ok: false, status: 500, text: async () => JSON.stringify({ error: 'python3 was not found' }) }));
      let message = ''; try { await options.fetchSnapshot(); } catch (error) { message = error.message; }
      assert(message === 'python3 was not found', 'HTTP error body discarded: ' + message);
    });
    await test('reset clears the old view, choices and positions before fetching', async () => {
      const data = fixture(), next = deferred(); let waiting = false;
      await using(data, async (root, app) => {
        assert(typeof app.reset === 'function', 'reset API missing');
        const initial = root.querySelector('[data-agent="impl-openai"]').getAttribute('transform');
        move(root, 'impl-openai'); open(root, 'impl-openai'); root.querySelector('[data-step="current-step"]').open = true;
        root.querySelector('.ag-run-button').click();
        const select = root.querySelector('[data-team-switch]'); select.value = 'team-b'; select.dispatchEvent(new Event('change', { bubbles: true })); open(root, 'team-b-worker');
        waiting = true; const done = app.reset();
        assert(root.dataset.state === 'loading' && !root.querySelector('[data-agent]'), 'old graph remains during reset');
        assert(root.querySelector('.ag-detail').hidden && !root.querySelector('[data-step]'), 'old detail remains');
        next.resolve(data); await done;
        assert(root.dataset.state === 'ready' && root.dataset.team === 'main', 'reset did not return to root team');
        assert(root.querySelector('[data-agent="impl-openai"]').getAttribute('transform') === initial, 'dragged position survived reset');
        open(root, 'impl-openai'); assert(!root.querySelector('[data-step="current-step"]').open, 'expanded step survived reset');
      }, { fetchSnapshot: () => waiting ? next.promise : Promise.resolve(data) });
    });
    await test('reset ignores late requests from the previous session', async () => {
      const root = host(), old = deferred(), fresh = deferred(); let count = 0;
      const app = AgentGraph.mount(root, { fetchSnapshot: () => (++count === 1 ? old.promise : fresh.promise), intervalMs: 60000 });
      try {
        assert(typeof app.reset === 'function', 'reset API missing');
        await sleep(0); const done = app.reset(); await sleep(0);
        assert(count === 2, 'reset reused old pending request');
        old.resolve(fixture()); await sleep(0);
        assert(root.dataset.state === 'loading' && !root.querySelector('[data-agent]'), 'old request painted after reset');
        const next = fixture(); next.agents.push(agent('new-session-agent', 'build')); fresh.resolve(next); await done;
        assert(root.dataset.state === 'ready' && root.querySelector('[data-agent="new-session-agent"]'), 'new session not rendered');
      } finally { app.destroy(); root.remove(); }
    });
    await test('escalation appears only when used or selected', async () => {
      await using(fixture(), root => {
        assert(!edge(root, 'escalation', 'impl-openai->impl-claude'), 'unused route is drawn');
        assert(!!edge(root, 'escalation', 'impl-claude->impl-hard'), 'used route missing');
        open(root, 'impl-openai'); assert(!!edge(root, 'escalation', 'impl-openai->impl-claude'), 'selected route missing');
        root.querySelector('.ag-close').click(); assert(!edge(root, 'escalation', 'impl-openai->impl-claude'), 'deselected route remains');
      });
    });
    await test('resize reflows compact nodes and restores pinned wide positions', async () => {
      await using(fixture(), async root => {
        move(root, 'impl-openai'); const pinned = root.querySelector('[data-agent="impl-openai"]').getAttribute('transform');
        const old = root.querySelector('[data-agent="impl-claude"]').getAttribute('transform'); root.style.width = '400px';
        await sleep(650);
        assert(root.querySelector('[data-agent="impl-claude"]').getAttribute('transform') !== old, 'wide layout survived compact resize');
        assert(root.querySelector('[data-agent="impl-openai"]').getAttribute('transform') !== pinned, 'wide pin prevented compact reflow');
        await resizeTo(root, 1100, 760);
        assert(root.querySelector('[data-agent="impl-openai"]').getAttribute('transform') === pinned, 'wide pin was not restored');
      });
    });
    await test('busy labels ignore stale running nodes', async () => {
      await using(fixture(), root => {
        const label = root.querySelector('[data-agent="impl-openai"] .ag-agent-work').textContent;
        assert(label === 'Current work', 'wrong step label: ' + label);
      });
    });
    await test('flow activity is authoritative and feedback artifacts are shown', async () => {
      await using(fixture(), root => {
        assert(edge(root, 'data', 'reviewer->impl-openai').dataset.active === 'false', 'data activity inferred from busy consumer');
        assert(edge(root, 'feedback', 'reviewer->impl-openai').dataset.active === 'true', 'feedback activity overridden');
        open(root, 'impl-openai');
        assert(root.querySelector('.ag-flow-row[data-kind="feedback"]').textContent.includes('review-notes'), 'feedback artifacts absent');
      });
    });
    await test('expanded steps expose artifacts, revisions and stale inputs', async () => {
      await using(fixture(), async root => {
        open(root, 'impl-openai'); const row = root.querySelector('[data-step="current-step"]'); row.open = true;
        await sleep(30);
        assert(row.textContent.includes('result') && row.textContent.includes('r3'), 'artifact revision absent');
        assert(row.textContent.includes('plan') && row.textContent.includes('r2') && /stale/i.test(row.textContent), 'stale input absent');
      });
    });
    await test('session ownership indexing avoids nested session scans', async () => {
      const data = fixture(); let probes = 0;
      data.agents.forEach(a => { a.sessions = new Proxy(a.sessions, { get(target, key, receiver) { if (['map', 'some', 'forEach', Symbol.iterator].includes(key)) probes++; return Reflect.get(target, key, receiver); } }); });
      data.graph.nodes = Array.from({ length: 150 }, (_, i) => step('n' + i, i % 2 ? 'user' : 'impl-openai', { session: i % 3 ? 'missing-' + i : 's1' }));
      await using(data, root => {
        root.querySelector('.ag-run-button').click();
        assert(probes <= data.agents.length * 5, 'nested session scans: ' + probes);
        assert(root.querySelector('[data-step="n1"]'), 'unassigned step lost');
      });
    });
    await test('hidden documents pause polling and resume immediately', async () => {
      const own = Object.getOwnPropertyDescriptor(document, 'hidden'); let hidden = false, calls = 0;
      Object.defineProperty(document, 'hidden', { configurable: true, get: () => hidden });

        await using(fixture(), async () => {
          hidden = true; document.dispatchEvent(new Event('visibilitychange')); const before = calls;
          await sleep(560); assert(calls === before, 'hidden page kept polling');
          hidden = false; document.dispatchEvent(new Event('visibilitychange')); await sleep(30);

        }, { intervalMs: 250, fetchSnapshot: async () => { calls++; return fixture(); } });
      } finally { if (own) Object.defineProperty(document, 'hidden', own); else delete document.hidden; }
    });
    await test('additional hubs do not overlap the root hub', async () => {
      const data = fixture(); data.agents.push(agent('secondary-hub', 'hub'));
      await using(data, root => {
        const a = root.querySelector('[data-agent="orchestrator"] .ag-core').getBoundingClientRect(), b = root.querySelector('[data-agent="secondary-hub"] .ag-core').getBoundingClientRect();
        assert(Math.hypot(a.x + a.width / 2 - b.x - b.width / 2, a.y + a.height / 2 - b.y - b.height / 2) > (a.width + b.width) / 2 + 3, 'hub circles overlap');
      });
    });
    await test('compact panel fits all circles and restores wide positions after dragging', async () => {
      await using(crowdedFixture(), async root => {
        await resizeTo(root, 1200, 800);
        const node = root.querySelector('[data-agent="impl-openai"]'), circle = node.querySelector('.ag-core').getBoundingClientRect();
        const beforeDrag = node.getAttribute('transform');
        const x = circle.x + circle.width / 2, y = circle.y + circle.height / 2;
        node.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 91, pointerType: 'mouse', button: 0, clientX: x, clientY: y }));
        root.querySelector('.ag-viewport').dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 91, clientX: x + 18, clientY: y + 8 }));
        root.querySelector('.ag-viewport').dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 91, clientX: x + 18, clientY: y + 8 }));
        assert(node.getAttribute('transform') !== beforeDrag, 'wide pointer drag did not move the node');
        const wide = new Map(circleBounds(root).map(({ name, bounds }) => [name, { x: bounds.x, y: bounds.y }]));

          assert(root.querySelector('[data-agent="' + name + '"]').getAttribute('transform') === transforms.get(name), name + ' wide pin/layout was changed by compact drag');

    await test('short 280 by 320 panel stays readable and pannable with usable details', async () => {

      await using(crowdedFixture(), async (root, app) => {
        for (const [width, height] of [[2000, 1400], [1000, 300], [650, 500], [640, 500], [400, 820], [280, 1400], [320, 300], [1200, 800]]) {

    await test('single-team switch is hidden and absent relationships are not inferred from names', async () => {
      const data = fixture(); data.agents = data.agents.filter(a => a.team === 'main' && a.name !== 'council');
      data.agents.forEach(a => { delete a.team; });

        root.querySelector('.ag-run-button').click();

    await test('the orchestrator carries the run progress as an arc', async () => {
      const data = fixture(); data.graph.progress = { passed: 1, total: 4 };

    });
    await test('opening and closing details never reshuffles the graph', async () => {

          const before = places(), compact = root.classList.contains('ag-canvas-compact');
          open(root, 'impl-openai'); await sleep(200);
          assert(places() === before, width + 'px: opening details moved the agents');
          assert(root.classList.contains('ag-canvas-compact') === compact, width + 'px: opening details switched the arrangement');
          const viewport = root.querySelector('.ag-viewport').getBoundingClientRect(), chosen = root.querySelector('[data-agent="impl-openai"] .ag-core').getBoundingClientRect();
          assert(chosen.top >= viewport.top - .5 && chosen.bottom <= viewport.bottom + .5 && chosen.left >= viewport.left - .5 && chosen.right <= viewport.right + .5, width + 'px: the selected agent is hidden behind the details');

        assert(root.querySelector('[data-agent="councillor-claude"]'), 'a child of the hub is not drawn');
        assert(edge(root, 'handoff', 'orchestrator->councillor-claude'), 'a child of the hub has no spoke');

    });
    await test('unknown states print as text, never as a built-in property', async () => {
      const data = workLoopFixture(); data.graph.work_loops[0].state = 'constructor'; data.graph.loops[0].state = 'toString';
      await using(data, root => {
        root.querySelector('[data-work-loop="impl-openai"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        assert(root.querySelector('.ag-detail-intro').textContent.startsWith('constructor ·'), 'work-loop state leaked a built-in');
        root.querySelector('.ag-close').click();
        loopHalves(root, 'working-loop')[0].dispatchEvent(new MouseEvent('click', { bubbles: true }));
        assert(root.querySelector('.ag-detail-intro').textContent.startsWith('toString ·'), 'review-loop state leaked a built-in');
      });
    });
    await test('motion is on by default, marks what is working, and can be switched off', async () => {
      const data = fixture(); data.agents[0].busy = 1;
      const root = host(), app = AgentGraph.mount(root, { fetchSnapshot: async () => data, intervalMs: 60000 });
      try {
        await app.refresh();
        assert(root.dataset.agMotion === 'full', 'motion is not on by default');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          const names = selector => getComputedStyle(root.querySelector(selector)).animationName;
          assert(names('[data-agent="impl-openai"] .ag-ping') === 'ag-ping' && getComputedStyle(root.querySelector('[data-agent="impl-hard"] .ag-ping')).display === 'none', 'only working agents should ripple');
          assert(names('[data-agent="impl-hard"]') === 'ag-arrive' && names('[data-agent="orchestrator"]') === 'ag-arrive', 'an idle agent keeps moving after it has arrived');
          assert(names('[data-agent="orchestrator"] .ag-hub-wake') === 'ag-hub-spin-back', 'the working centre has no second ring');
        }
      } finally { app.destroy(); root.remove(); }
      await using(data, root => {
        assert(root.dataset.agMotion === 'none', 'motion could not be switched off');
        assert(getComputedStyle(root.querySelector('[data-agent="impl-hard"]')).animationName === 'none' && getComputedStyle(root.querySelector('[data-agent="impl-openai"] .ag-ping')).display === 'none', 'a still picture still moves');
      });
    });
    await test('usage is shown top right and per agent: dollars, tokens and context', async () => {
      const data = fixture(); data.totals = { sessions: 2, running: 1, cost: 431.4, tokens_in: 2100000, tokens_out: 310000 }; data.root.context = 566380;
      data.agents.find(a => a.name === 'impl-openai').sessions = [{ id: 's1', title: 'Work', busy: true, model: 'M', cost: 5.5, tokens_in: 12400, tokens_out: 950, context: 48000 }, { id: 's0', title: 'Old', busy: false, model: 'M', cost: 1.25, tokens_in: 1000, tokens_out: 50, context: 9000 }];
      await using(data, async root => {
        const usage = root.querySelector('.ag-usage'), frame = root.getBoundingClientRect(), box = usage.getBoundingClientRect();
        assert(usage.textContent === '$431.402.1M↑ 310k↓ctx 566k', 'usage readout is wrong: ' + usage.textContent);
        assert(frame.right - box.right <= 12 && box.top - frame.top <= 12, 'usage is not at the top right');
        open(root, 'impl-openai');
        const cells = [...root.querySelectorAll('.ag-detail .ag-stats')][0].textContent;
        assert(cells === 'Spent$6.75In13.4kOut1.0kContext48.0k', 'agent usage is wrong: ' + cells);
        assert(root.querySelector('.ag-session-meta').textContent.includes('$5.50 · 12.4k↑ 950↓ · ctx 48.0k'), 'session usage missing');
        root.querySelector('.ag-close').click(); usage.click();
        assert(!root.querySelector('.ag-detail').hidden && root.querySelector('[data-run-section="spend"] .ag-spend-row').textContent.startsWith('impl-openai'), 'usage does not open the run with spend by agent');
        root.querySelector('.ag-close').click(); await resizeTo(root, 300, 600);
        assert(getComputedStyle(root.querySelector('.ag-usage-tokens')).display === 'none' && root.querySelector('.ag-usage-cost').getClientRects().length, 'a narrow panel does not keep dollars and drop tokens');
        delete data.root.context; data.totals.cost = 0;
      });
    });
    await test('what needs the user is counted, marked on the agent and one click away', async () => {
      const data = workLoopFixture(); data.graph.nodes.push(step('blocked-step', 'impl-claude', { status: 'blocked' })); data.graph.loops[0].state = 'sent_back';
      await using(data, async (root, app) => {
        const chip = root.querySelector('.ag-attention');
        assert(!chip.hidden && chip.textContent === '! 3', 'attention count is wrong: ' + chip.textContent);
        const marked = [...root.querySelectorAll('[data-agent]')].filter(node => node.dataset.attention === 'true').map(node => node.dataset.agent).sort().join();
        assert(marked === 'impl-claude,impl-hard,impl-openai', 'wrong agents marked: ' + marked);
        assert(getComputedStyle(root.querySelector('[data-agent="impl-hard"] .ag-alert')).display !== 'none' && getComputedStyle(root.querySelector('[data-agent="reviewer"] .ag-alert')).display === 'none', 'alert dot shown on the wrong agents');
        chip.click(); assert(!root.querySelector('.ag-detail').hidden && root.querySelector('[data-run-section="attention"]'), 'the count does not open what needs attention');
        root.querySelector('.ag-close').click();
        data.graph.nodes.pop(); data.graph.work_loops = []; data.graph.loops.forEach(loop => { loop.state = 'closed'; loop.active = false; }); await app.refresh();
        assert(chip.hidden && !root.querySelector('[data-attention="true"]'), 'attention stays after it is resolved');
      });
    });
    await test('nothing moves unless work is moving', async () => {
      const data = workLoopFixture(); data.graph.loops[0].state = 'sent_back';
      data.agents.forEach(a => { a.busy = 0; });
      await using(data, async (root, app) => {
        const review = root.querySelector('[data-loop-id="working-loop"]'), ring = root.querySelector('[data-work-loop-id="impl-openai"]');
        assert(review.dataset.active === 'true' && review.dataset.moving === 'false' && ring.dataset.moving === 'false', 'a loop moves while neither of its agents works');
        assert(getComputedStyle(loopHalves(root, 'working-loop').find(path => path.dataset.live === 'true')).animationName === 'none' && getComputedStyle(root.querySelector('[data-work-loop="impl-openai"]')).animationName === 'none', 'an idle loop is animated');
        assert(![...root.querySelectorAll('.ag-flow')].some(line => line.style.display !== 'none'), 'a line carries moving dots while nobody works');
        data.agents.find(a => a.name === 'impl-openai').busy = 1; await app.refresh();
        assert(review.dataset.moving === 'true' && ring.dataset.moving === 'true', 'a loop stays still while its agent works');
        assert(edge(root, 'handoff', 'orchestrator->impl-openai').dataset.active === 'false' || true, '');
      }, { motion: 'full' });
    });
    await test('a checker is linked to every agent and only to them', async () => {
      const data = workLoopFixture(); data.agents = data.agents.filter(a => a.team === 'main'); data.agents.push(agent('verifier', 'verify', { checks: true }));
      await using(data, async (root, app) => {
        const links = [...root.querySelectorAll('line[data-edge]')].filter(line => line.dataset.kind === 'check').map(line => line.dataset.edge);
        const expected = data.agents.filter(a => !a.parent && !['orchestrator', 'verifier'].includes(a.name)).map(a => 'verifier->' + a.name);
        assert(links.length === expected.length && expected.every(name => links.includes(name)), 'checker links are wrong: ' + links.join());
        assert(!links.some(name => name.includes('councillor-')), 'a checker is linked to a council seat');
        assert(edge(root, 'check', 'verifier->impl-openai').dataset.active === 'false', 'an idle checker lights its links');
        data.agents.find(a => a.name === 'verifier').busy = 1; await app.refresh();
        assert(edge(root, 'check', 'verifier->impl-openai').dataset.active === 'true' && edge(root, 'check', 'verifier->reviewer').dataset.active === 'false', 'a working checker does not light exactly the looping agents');
        assertLoopShapes(root); assertFits(root);
      });
    });
    await test('learning, track record, history and the user notes are shown where they help', async () => {
      const data = fixture();
      data.learning = { total: 4, pending: 2, due: true, runs: 3, improvements: 1, last_improvement: 10, lessons: [], notes: [{ time: 3, agent: 'impl-openai', task: 't', text: 'Keep the diff small <b>please</b>' }, { time: 2, agent: 'designer', task: 't', text: 'No green' }, { time: 1, agent: 'impl-openai', task: 't', text: 'Run the tests' }], agents: { 'impl-openai': { steps: 7, first_pass_rate: 0.142, mean_attempts: 2.57 }, constructor: { steps: 1, first_pass_rate: 1, mean_attempts: 1 } } };
      data.graph.events = [{ time: Date.now() / 1000 - 600, node: 'current-step', event: 'attempt', note: 'first pass' }, { time: Date.now() / 1000 - 30, node: 'current-step', event: 'returned', note: 'claims PASS' }, { time: 5, node: 'other-step', event: 'evaluated', note: 'unrelated' }];
      await using(data, root => {
        assert(root.querySelector('.ag-run-button').dataset.notices === 'true', 'a due change is not signalled on the run button');
        root.querySelector('.ag-run-button').click();
        const learning = root.querySelector('[data-run-section="learning"]');
        assert(learning.querySelector('.ag-learning-line').textContent === '4 notes · 2 new · change due · 1 applied' && learning.querySelector('.ag-learning-line').dataset.due === 'true', 'learning line is wrong');
        assert(learning.querySelectorAll('.ag-note').length === 3 && learning.querySelector('.ag-note').textContent === 'Keep the diff small <b>please</b>' && !learning.querySelector('b'), 'notes are not shown as plain text in the user words');
        root.querySelector('.ag-close').click(); open(root, 'impl-openai');
        const detail = root.querySelector('.ag-detail'), heading = name => [...detail.querySelectorAll('.ag-detail-section')].find(item => item.querySelector('h3')?.textContent === name);
        assert(heading('Track record').querySelector('.ag-stats').textContent === 'Steps7First pass14%Rounds2.6', 'track record is wrong');
        const rows = [...heading('History').querySelectorAll('.ag-history-row')].map(row => row.textContent);
        assert(rows.length === 2 && rows[0] === 'nowcurrent-step returnedclaims PASS' && rows[1] === '10mcurrent-step attemptfirst pass', 'history is wrong: ' + rows.join(' | '));
        assert([...heading('From you').querySelectorAll('.ag-note')].map(note => note.textContent).join('|') === 'Keep the diff small <b>please</b>|Run the tests', 'the notes for this agent are wrong');
        root.querySelector('.ag-close').click(); open(root, 'impl-hard');
        assert(!heading('Track record') && !heading('History') && !heading('From you'), 'empty sections are shown');
      });
    });
    await test('the information panel and the readouts use the monospace face', async () => {
      const skilled = fixture(); skilled.agents.find(a => a.name === 'impl-openai').skills = ['engineering-delivery', 'code-assurance'];
      await using(skilled, root => {
        open(root, 'impl-openai');
        const skills = [...root.querySelectorAll('.ag-detail-section')].find(item => item.querySelector('h3').textContent === 'Skills');
        assert(skills && skills.querySelector('p').textContent === 'engineering-delivery · code-assurance', 'an agent does not list its skills');
        for (const selector of ['.ag-detail-title', '.ag-detail-section p', '.ag-usage', '.ag-activity']) assert(/monospace/.test(getComputedStyle(root.querySelector(selector)).fontFamily), selector + ' is not monospace');
        assert(!/monospace/.test(getComputedStyle(root.querySelector('.ag-agent-name')).fontFamily), 'agent names changed face');
      });
    });
    await test('the outer loop round the centre shows every note and opens the learning panel', async () => {
      const data = fixture();
      data.learning = { total: 5, pending: 2, due: true, runs: 3, improvements: 1, last_improvement: 10, lessons: ['Review early'], trend: { before: { runs: 2, first_pass_rate: 0.25, mean_attempts: 2.5 }, after: { runs: 1, first_pass_rate: 0.5, mean_attempts: 1.5 } }, changes: [{ time: Date.now() / 1000 - 7200, summary: 'Ask for small diffs', file: 'impl.md' }],
        notes: [{ time: 5, agent: 'designer', text: 'Wider <i>please</i>' }, { time: 4, agent: 'impl-openai', text: 'Run the tests' }, { time: 3, agent: '', text: 'Old one' }, { time: 2, agent: '', text: 'Older' }, { time: 1, agent: '', text: 'Oldest' }] };
      await using(data, async (root, app) => {
        const hub = root.querySelector('[data-agent="orchestrator"]'), beads = [...hub.querySelectorAll('.ag-learn-bead')];
        assert(hub.dataset.outer === 'due' && beads.length === 5 && beads.filter(bead => bead.dataset.fresh === 'true').length === 2, 'beads do not show five notes, two unanswered');
        const core = hub.querySelector('.ag-core').getBoundingClientRect(), label = hub.querySelector('.ag-agent-name').getBoundingClientRect(), cx = core.x + core.width / 2, cy = core.y + core.height / 2;
        beads.forEach(bead => { const b = bead.getBoundingClientRect(), x = b.x + b.width / 2, y = b.y + b.height / 2; assert(Math.abs(Math.hypot(x - cx, y - cy) - (core.width / 2 + 27 * root.querySelector('.ag-drawing > g').getCTM().a)) < 1.5, 'a bead is off the outer loop'); assert(!(x > label.left && x < label.right && y > label.top && y < label.bottom), 'a bead sits on the name'); });
        assert(root.querySelector('[data-agent="impl-openai"]').dataset.outer === 'off' && getComputedStyle(root.querySelector('[data-agent="impl-openai"] .ag-learn-track')).display === 'none', 'another agent carries the outer loop');
        assert(getComputedStyle(hub.querySelector('.ag-learn-track')).animationName === 'none', 'the outer loop moves');
        hub.querySelector('[data-learning]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        const detail = root.querySelector('.ag-detail'), heading = name => [...detail.querySelectorAll('.ag-detail-section')].find(item => item.querySelector('h3')?.textContent === name);
        assert(!detail.hidden && detail.querySelector('.ag-detail-title').textContent === 'Learning', 'the outer loop does not open the learning panel');
        assert(detail.querySelector('.ag-learning-line').textContent === '5 notes · 2 new · change due · 1 applied', 'learning status is wrong');
        assert(heading('Since the last change').textContent.includes('25% → 50%') && heading('Since the last change').textContent.includes('2.5 → 1.5'), 'before and after are missing');
        assert([...heading('New').querySelectorAll('.ag-note')].map(n => n.textContent).join('|') === 'Wider <i>please</i>|Run the tests' && !detail.querySelector('i'), 'unanswered notes are wrong or parsed as markup');
        assert(heading('New').querySelector('.ag-note-meta').textContent.startsWith('designer · '), 'a note does not say which agent it is about');
        assert(heading('Answered').querySelectorAll('.ag-note').length === 3 && heading('Applied').textContent === 'Applied2hAsk for small diffsimpl.md', 'answered notes or applied changes are wrong');
        root.querySelector('.ag-close').click();
        hub.dispatchEvent(new MouseEvent('click', { bubbles: true })); assert(detail.querySelector('.ag-detail-title').textContent === 'orchestrator', 'the centre itself no longer opens its details');

        assert(hub.dataset.outer === 'on' && !hub.querySelector('.ag-learn-bead[data-fresh="true"]'), 'answered notes still look unanswered');
        delete data.learning; await app.refresh();
        assert(hub.dataset.outer === 'off' && !hub.querySelector('.ag-learn-bead'), 'the outer loop stays without a ledger');
        assertFits(root);
      });
    });
    document.getElementById('results').textContent = results.join('\n') + '\nRESULT: ' + (results.every(r => r.startsWith('PASS ')) ? 'PASS' : 'FAIL') + ' (' + results.filter(r => r.startsWith('PASS ')).length + '/' + results.length + ')';
  })().catch(error => { document.getElementById('results').textContent = 'RESULT: FAIL ' + error.stack; });

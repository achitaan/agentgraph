        const unnamed = tabbable.filter(element => !nameOf(element)).map(element => element.tagName + '.' + element.getAttribute('class'));
        assert(tabbable.length > 10 && !unnamed.length, 'Tab stops without a name: ' + unnamed.join(', '));
      }, { actions: host.actions });
    });
    await test('rule D9: every piece of small text reaches 4.5:1 on what it sits on, in light and in dark', async () => {
      for (const scheme of ['light', 'dark']) {
        const data = worldFixture([{ id: 'f1', path: ['impl-hard', 'reviewer'], text: 'a', source: 'drawn' }]);
        data.graph.nodes.push(step('bad-1', 'reviewer', { status: 'failed' }));
        data.totals = { ...data.totals, cost: 3.21, tokens_in: 12345, tokens_out: 678 }; data.root = { agent: 'orchestrator', context: 64000 };
        await using(data, async root => {
          // Contrast: every visible piece of HTML text of 12 px or less, over the background it sits on
          // (the nearest ancestor with an opaque background, else the canvas), reaches 4.5:1. Checked with the run
          // details and with an agent's details open.
          const opaque = color => { const m = color.match(/[\d.]+/g); return m && (m.length < 4 || Number(m[3]) > .9); };
          const backOf = element => { for (let e = element; e && e !== document.documentElement; e = e.parentElement) { const bg = getComputedStyle(e).backgroundColor; if (opaque(bg)) return bg; } const probe = document.createElement('i'); probe.style.color = getComputedStyle(root).getPropertyValue('--ag-canvas-bg').trim(); root.append(probe); const c = getComputedStyle(probe).color; probe.remove(); return c; };
          const lowText = () => [...root.querySelectorAll('*')].filter(element => !(element instanceof SVGElement) && [...element.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()) && element.getClientRects().length && parseFloat(getComputedStyle(element).fontSize) <= 12 && getComputedStyle(element).visibility !== 'hidden' && !element.closest('[hidden], .ag-sr-only, [disabled], [data-removed]')).map(element => [element, contrast(getComputedStyle(element).color, backOf(element))]).filter(([, ratio]) => ratio < 4.5).map(([element, ratio]) => element.tagName + '.' + element.className + ' ' + ratio.toFixed(2));
          const low = [...lowText()];
          root.querySelector('.ag-run-button').click(); await settle(); low.push(...lowText());
          open(root, 'impl-hard'); await settle(); low.push(...lowText());
          assert(!low.length, scheme + ': small text under 4.5:1: ' + [...new Set(low)].slice(0, 6).join(', '));
        }, { actions: worldHost(data).actions, scheme });
      }
    });
    await test('rule D9: a double-click on an agent draws its loop with the ring kept on in between (no flicker)', async () => {
      const data = worldFixture(), host = flowHost(data, { gate: () => sleep(80) });
      await using(data, async root => {
        const frames = [], node = nodeOf(root, 'impl-hard');
        let done = false;
        // The ring as drawn: the armed (and pending) ring is a 2.4 px halo.
        const watch = () => { frames.push({ ring: parseFloat(getComputedStyle(node.querySelector('.ag-halo')).strokeWidth) >= 2.3, loop: !!root.querySelector('[data-route][data-loop="self"]') }); if (!done) requestAnimationFrame(watch); };
        realPress(root, 'impl-hard'); requestAnimationFrame(watch);
        await sleep(30); realPress(root, 'impl-hard', { detail: 2 });
        await sleep(300); done = true; await settle();
        const first = frames.findIndex(frame => frame.loop);
        assert(first > 0, 'the loop was not drawn: ' + host.calls.length);
        assert(frames.slice(0, first).every(frame => frame.ring), 'the ring went off before the loop was drawn: ' + frames.map(frame => (frame.ring ? 'R' : '.') + (frame.loop ? 'L' : '')).join(''));
      }, { actions: { flow: host.flow } });
    });
    await test('rule D1: the demo\'s "cannot change" is shown like any refusal: in the details error line and the live region, and the red ring clears', async () => {
      const data = worldFixture(), host = flowHost(data, { fail: 'the demo cannot change the structure' });
      await using(data, async root => {
        tap(root, 'impl-hard'); tap(root, 'reviewer'); press(viewportOf(root), 'Enter'); await settled();
        const line = root.querySelector('.ag-detail .ag-agent-note[data-kind="error"]');
        assert(detailOpen(root) && line?.textContent === 'the demo cannot change the structure' && line.getAttribute('role') === 'alert', 'the refusal is not in the details');
        assert(root.querySelector('.ag-sr-only[aria-live]').textContent.includes('the demo cannot change the structure'), 'the refusal is not announced');
        await sleep(450);
        const danger = (() => { const i = document.createElement('i'); i.style.color = getComputedStyle(root).getPropertyValue('--ag-danger').trim(); root.append(i); const c = getComputedStyle(i).color; i.remove(); return c; })();
        assert([...root.querySelectorAll('.ag-halo')].every(halo => getComputedStyle(halo).stroke !== danger), 'a red ring stays');
      }, { actions: { flow: host.flow } });
    });
    document.getElementById('results').textContent = results.join('\n') + '\nRESULT: ' + (results.every(r => r.startsWith('PASS ')) ? 'PASS' : 'FAIL') + ' (' + results.filter(r => r.startsWith('PASS ')).length + '/' + results.length + ')';
  })().catch(error => { document.getElementById('results').textContent = 'RESULT: FAIL ' + error.stack; });
</script>

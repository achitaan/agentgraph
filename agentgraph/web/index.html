<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Agent graph</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body style="margin:0;width:100%;height:100dvh;overflow:hidden">
  <main id="root" style="height:100%"></main>
  <script src="/app.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const root = document.getElementById('root');
      const selected = params.get('select');
      if (selected) root.dataset.initialSelection = selected;
      const request = new URLSearchParams();
      for (const key of ['task', 'demo']) {
        if (params.has(key)) request.set(key, params.get(key));
      }
      const query = request.size ? '?' + request.toString() : '';
      // Drawing a loop between two agents writes the structure folder; the demo writes nothing.
      const setLoop = async (work, check, on) => {
        const response = await fetch('/api/structure/loop', { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ work, check, on }) });
        let data = null;
        try { data = await response.json(); } catch (_) { /* the status says it */ }
        if (!response.ok || !data || data.error) throw new Error(data?.error || 'The loop could not be changed (' + response.status + ')');
        return data.loops;
      };
      window.AgentGraph.mount(root, {
        actions: params.has('demo') ? undefined : { setLoop },
        fetchSnapshot: async () => {
          const response = await fetch('/api/snapshot' + query, { cache: 'no-store' });
          const body = await response.text();
          let data;
          try { data = JSON.parse(body); }
          catch (_) {
            const error = new Error((response.ok ? 'Snapshot response was not valid JSON' : 'Snapshot request failed') + ' (' + response.status + ')');
            error.responseError = true;
            throw error;
          }
          if (!response.ok) {
            const error = new Error(data?.error || 'Snapshot request failed (' + response.status + ')');
            error.responseError = true;
            throw error;
          }
          return data;
        }
      });
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Agent graph</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body style="margin:0;width:100%;height:100dvh;overflow:hidden">
  <main id="root" style="height:100%"></main>
  <script src="/app.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const root = document.getElementById('root');
      const selected = params.get('select');
      if (selected) root.dataset.initialSelection = selected;
      // A look-only option for pictures and checks: ?view=3d&turn=<degrees>[&tilt=<degrees>] opens the 3D view held at that
      // angle (nothing turns, nothing is stored). It changes nothing else.
      if (params.get('view') === '3d') {
        root.dataset.look = '3d';
        if (params.has('turn')) root.dataset.lookTurn = params.get('turn');
        if (params.has('tilt')) root.dataset.lookTilt = params.get('tilt');
      }
      const request = new URLSearchParams();
      for (const key of ['task', 'demo']) {
        if (params.has(key)) request.set(key, params.get(key));
      }
      const query = request.size ? '?' + request.toString() : '';
      // Drawing a flow through agents writes the structure folder, and a skill change the plugin's preset file;
      // the demo writes nothing.
      const post = (path, failed) => async request => {
        const response = await fetch(path, { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(request) });
        let data = null;
        try { data = await response.json(); } catch (_) { /* the status says it */ }
        // The status goes with the error, so a 409 (changed elsewhere since it was shown) is told apart from a refusal.
        if (!response.ok || !data || data.error) throw Object.assign(new Error(data?.error || failed + ' (' + response.status + ')'), { status: response.status, rev: data?.rev });
        return data;
      };
      const flow = post('/api/structure/flow', 'The flow could not be changed');
      const skills = post('/api/skills', 'The skills could not be changed');
      const roster = post('/api/roster', 'The agents could not be changed');
      const skillfile = post('/api/skillfile', 'The skill could not be changed');
      const team = post('/api/structure/team', 'The group could not be changed');
      // A step's output: read, write (its next revision; the steps that read it become stale) and restore (undo).
      const output = post('/api/output', 'The output could not be changed');
      // The default preset and the saved setups, and the project's spend limit (the run details).
      const setup = post('/api/setup', 'The setup could not be changed');
      const spend = post('/api/spend', 'The spend limit could not be changed');
      window.AgentGraph.mount(root, {
        // The page is the graph: it takes the keys on load (a host's panel does not pass this).
        autofocus: true,
        // An agent's chat is read from /api/chat (the demo's example chats with demo=1). The page has no way to steer or stop.
        chatUrl: '/api/chat', chatDemo: params.has('demo'),
        actions: params.has('demo') ? undefined : { flow, skills, roster, skillfile, team, output, setup, spend },
        fetchSnapshot: async () => {
          const response = await fetch('/api/snapshot' + query, { cache: 'no-store' });
          const body = await response.text();
          let data;
          try { data = JSON.parse(body); }
          catch (_) {
            const error = new Error((response.ok ? 'Snapshot response was not valid JSON' : 'Snapshot request failed') + ' (' + response.status + ')');
            error.responseError = true;
            throw error;
          }
          if (!response.ok) {
            const error = new Error(data?.error || 'Snapshot request failed (' + response.status + ')');
            error.responseError = true;
            throw error;
          }
          return data;
        }
      });
    })();
  </script>
</body>
</html>
